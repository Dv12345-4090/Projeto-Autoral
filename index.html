<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xadrez Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px 12px;background:#171923;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;flex-direction:column}
h1{color:#f0c674;margin:4px 0 10px}
#status{margin:10px;text-align:center;font-size:18px}
#board{width:min(92vw,560px);height:min(92vw,560px);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:5px solid #4b3828;overflow:hidden}
.square{width:100%;height:100%;min-width:0;min-height:0;margin:0;padding:0;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.light{background:#f0d9b5}.dark{background:#779556}.square.selected{background:#f6f669}
.square.target:after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#233b2c;opacity:.65}
.square.takes:after{content:"";position:absolute;inset:5%;border:4px solid #d33;border-radius:50%}
.piece-img{width:88%;height:88%;object-fit:contain;position:relative;z-index:1;pointer-events:none}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.controls button{padding:11px 15px;border:0;border-radius:8px;background:#f0c674;color:#171923;font-weight:bold;cursor:pointer}
#message{min-height:22px;color:#f0c674;text-align:center;margin-top:12px}
.note{font-size:13px;color:#c5c8d0;text-align:center}
</style>
</head>
<body>
<h1>♟ Xadrez Online</h1>
<div id="status">Carregando...</div>
<div id="board" aria-label="Tabuleiro de xadrez"></div>
<div class="controls">
<button onclick="restartGame()">Novo jogo</button>
<button onclick="flipBoard()">Girar tabuleiro</button>
<button onclick="undoMove()">Desfazer</button>
</div>
<div id="message" aria-live="polite"></div>
<p class="note">Peças personalizadas · Dois jogadores no mesmo computador</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){
  const status=document.getElementById("status");
  const message=document.getElementById("message");
  const board=document.getElementById("board");
  if(typeof Chess==="undefined"){
    status.textContent="Não foi possível carregar as regras do xadrez.";
    message.textContent="Verifique a conexão com a internet e atualize a página.";
    return;
  }
  const game=new Chess();
  const files="abcdefgh";
  let selected=null, moves=[], flipped=false;
  function piecePath(p){return "pecas/"+p.color+p.type.toUpperCase()+".png";}
  function render(){
    board.innerHTML="";
    const ranks=flipped?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1];
    const cols=flipped?["h","g","f","e","d","c","b","a"]:["a","b","c","d","e","f","g","h"];
    ranks.forEach((rank,row)=>cols.forEach((file,col)=>{
      const name=file+rank, piece=game.get(name), cell=document.createElement("button");
      cell.type="button";
      cell.className="square "+((row+col)%2===0?"light":"dark");
      cell.setAttribute("aria-label",name);
      if(selected===name)cell.classList.add("selected");
      const mv=moves.find(m=>m.to===name);
      if(mv)cell.classList.add(mv.captured||mv.flags.includes("e")?"takes":"target");
      if(piece){
        const img=document.createElement("img");
        img.className="piece-img";
        img.src=piecePath(piece);
        img.alt=(piece.color==="w"?"Branca ":"Preta ")+piece.type;
        img.onerror=()=>{img.alt="Peça";img.style.display="none";};
        cell.appendChild(img);
      }
      cell.addEventListener("click",()=>clickSquare(name));
      board.appendChild(cell);
    }));
    updateStatus();
  }
  function updateStatus(){
    if(game.in_checkmate()) status.textContent="Xeque-mate! "+(game.turn()==="w"?"Pretas":"Brancas")+" venceram!";
    else if(game.in_stalemate()) status.textContent="Empate por afogamento!";
    else if(game.in_draw()) status.textContent="Partida empatada!";
    else status.textContent="Vez das "+(game.turn()==="w"?"brancas":"pretas")+(game.in_check()?" — XEQUE!":"");
  }
  function clickSquare(name){
    if(game.game_over())return;
    const piece=game.get(name);
    if(selected){
      const mv=moves.find(m=>m.to===name);
      if(mv){
        let promotion="q";
        if(mv.flags.includes("p")){
          const answer=prompt("Promover peão: D=dama, T=torre, B=bispo, C=cavalo","D");
          promotion=({d:"q",t:"r",b:"b",c:"n"})[(answer||"d").toLowerCase()]||"q";
        }
        try{game.move({from:selected,to:name,promotion});selected=null;moves=[];message.textContent="";render();return;}
        catch(e){message.textContent="Jogada inválida.";}
      }
    }
    if(piece&&piece.color===game.turn()){
      selected=name;moves=game.moves({square:name,verbose:true});message.textContent="Escolha uma casa destacada.";
    }else{selected=null;moves=[];message.textContent="Selecione uma peça da sua cor.";}
    render();
  }
  window.restartGame=()=>{game.reset();selected=null;moves=[];message.textContent="";render();};
  window.undoMove=()=>{if(game.undo()){selected=null;moves=[];message.textContent="Jogada desfeita.";render();}};
  window.flipBoard=()=>{flipped=!flipped;render();};
  render();
})();
</script>
</body>
</html>
